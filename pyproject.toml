
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opsguard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "networkx>=3.2,<4"
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10"
]
report = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4"
]
live = [
    "openai>=2.33,<3"
]
groq = [
    "groq>=0.30,<2",
    "python-dotenv>=1,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
