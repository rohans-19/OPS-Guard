[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opsguard"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["networkx>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=7"]
live = ["openai>=2.33,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
