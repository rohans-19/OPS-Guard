apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-features
data:
  feature_flag: enabled
  cache_mode: normal
  metrics_enabled: enabled
  shared_mode: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: decoy-features
data:
  feature_flag: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opsguard-evidence
data:
  observation: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fixture
          image: python:3.12-alpine
          command: [python, -u, /app/app.py]
          env:
            - name: FIXTURE_SERVICE
              value: checkout
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: settings
              mountPath: /etc/opsguard
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: vikas-fixture-app
        - name: settings
          configMap:
            name: shared-features
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront-api
  template:
    metadata:
      labels:
        app: storefront-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fixture
          image: python:3.12-alpine
          command: [python, -u, /app/app.py]
          env:
            - name: FIXTURE_SERVICE
              value: storefront
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: settings
              mountPath: /etc/opsguard
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: vikas-fixture-app
        - name: settings
          configMap:
            name: shared-features
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decoy-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decoy-api
  template:
    metadata:
      labels:
        app: decoy-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fixture
          image: python:3.12-alpine
          command: [python, -u, /app/app.py]
          env:
            - name: FIXTURE_SERVICE
              value: decoy
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: settings
              mountPath: /etc/opsguard
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: vikas-fixture-app
        - name: settings
          configMap:
            name: decoy-features
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
spec:
  selector:
    app: checkout-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector:
    app: storefront-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: decoy
spec:
  selector:
    app: decoy-api
  ports:
    - name: http
      port: 8080
      targetPort: http
